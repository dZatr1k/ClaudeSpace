apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The app version is the repository version (package.json), so the APK and the desktop builds of one release match.
// versionCode must grow with every release: 0.7.10 -> 7010, 1.2.3 -> 1002003.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../../package.json')).version as String
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it.toInteger() }

// The agent bundle (python3 agent/build_manifest.py), packed as assets/agent: the core installs it on the VM over
// SSH, exactly as the desktop app installs resources/agent.
def repoRoot = file('../../..')
def agentAssetsDir = layout.buildDirectory.dir('generated/agent-assets').get().asFile
def agentAssets = tasks.register('agentAssets', Exec) {
    inputs.dir(new File(repoRoot, 'agent')).withPropertyName('agent')
    inputs.file(new File(repoRoot, 'package.json')).withPropertyName('packageJson')
    outputs.dir(agentAssetsDir)
    workingDir repoRoot
    commandLine 'python3', 'agent/build_manifest.py', '--out', new File(agentAssetsDir, 'agent').path
}
preBuild.dependsOn agentAssets

android {
    namespace = "io.github.claudespace"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.claudespace"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 1000000 + vMinor * 1000 + vPatch
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // the agent the core installs on the VM, from agent/ (see agentAssets below)
    sourceSets.main.assets.srcDirs += [agentAssetsDir]
    packaging {
        // BouncyCastle's multi-release jars carry the same OSGi manifests
        resources.excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "io.github.claudespace:core:$appVersion"
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

