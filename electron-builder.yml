# electron-builder: Windows NSIS installer + auto-update feed on GitHub Releases (stage 7).
# The GitHub owner/repo for publishing and for the updater come from package.json "repository" — the only place to edit.
# appId must stay equal to APP_ID in src/shared/app.ts (Windows toasts use it as AppUserModelID; tests check it).
appId: io.github.claudespace
productName: ClaudeSpace
copyright: Copyright © 2026 ClaudeSpace contributors

directories:
  output: release
  buildResources: build

# only the built app goes into app.asar; production node_modules are added by electron-builder
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # ssh2's optional native helpers are built for Node, not Electron: ssh2 falls back to pure JS without them
  - '!node_modules/ssh2/lib/protocol/crypto/{build,src,binding.gyp}'
  - '!node_modules/cpu-features/**'
  - '!node_modules/nan/**'
# no native rebuild against Electron headers: no runtime native modules (see above), no toolchain needed in CI
npmRebuild: false

# agent bundle (generated by `npm run agent:manifest`, part of `npm run build`) and the PTY helper of the local mode:
# main reads them from process.resourcesPath when packaged (src/main/index.ts: resourcesDir)
extraResources:
  - from: resources/agent
    to: agent
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc']
  - from: resources/ptyhelper.py
    to: ptyhelper.py
  # licences: the app (MIT) and the bundled fonts (SIL OFL 1.1 requires the licence text with every copy)
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: resources/fonts
    to: licenses
    filter: ['OFL-*.txt']

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # unsigned releases: no publisherName, so electron-updater does not try to verify an Authenticode signature
  verifyUpdateCodeSignature: false
  # no "requireAdministrator": installs and updates per user
  requestedExecutionLevel: asInvoker

nsis:
  # one click, per user (%LOCALAPPDATA%\Programs\ClaudeSpace), no UAC prompt; updates install silently the same way
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: ClaudeSpace
  runAfterFinish: true
  # settings, known_hosts and logs (%APPDATA%\ClaudeSpace) stay after uninstall
  deleteAppDataOnUninstall: false
  artifactName: ClaudeSpace-Setup-${version}.${ext}

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Development
  artifactName: ClaudeSpace-${version}-${arch}.${ext}

publish:
  provider: github
  # published at once (not a draft), otherwise installed apps would not see the update
  releaseType: release
